version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc, /workspace]
  read_write: [/tmp]
landlock:
  compatibility: hard_requirement
network_policies:
  deploy:
    endpoints:
      - host: api.internal.example.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/deploy
    binaries:
      - path: /usr/local/bin/deploy
