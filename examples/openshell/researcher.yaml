version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/workspace, /tmp]
landlock:
  compatibility: hard_requirement
network_policies:
  papers:
    endpoints:
      - host: arxiv.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: "*.wikipedia.org"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
