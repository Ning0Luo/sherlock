version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/workspace, /home/sandbox, /tmp]
landlock:
  compatibility: hard_requirement
network_policies:
  github:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
        credential_binding:
          provider: work-github
    binaries:
      - path: /usr/bin/git
      - path: /usr/bin/gh
  npm:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/npm
